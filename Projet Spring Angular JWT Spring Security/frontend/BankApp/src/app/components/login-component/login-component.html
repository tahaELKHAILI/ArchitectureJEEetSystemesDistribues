<div class="login-page">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">
        <div class="card login-card shadow-lg">
          <div class="card-body p-4">
            <h2 class="text-center fw-bold mb-4">Welcome</h2>

            <form [formGroup]="formLogin" (ngSubmit)="handleLogin()">

              <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="username"
                  placeholder="Enter your username">
              </div>

              <div class="mb-4">
                <label class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  formControlName="password"
                  placeholder="Enter your password">
              </div>

              <button class="btn btn-primary w-100 mb-4" type="submit">
                Sign In
              </button>

              <div class="alert alert-dark border border-secondary mb-0">
                <h6 class="text-info mb-3">Test Accounts</h6>

                <ul class="list-group list-group-flush">
                  <li class="list-group-item bg-dark text-light d-flex justify-content-between align-items-center">
        <span>
          <strong>admin</strong> / admin
        </span>
                    <span class="badge bg-danger">Admin</span>
                  </li>

                  <li class="list-group-item bg-dark text-light d-flex justify-content-between align-items-center">
        <span>
          <strong>user1</strong> / 1234
        </span>
                    <span class="badge bg-primary">User</span>
                  </li>

                  <li class="list-group-item bg-dark text-light d-flex justify-content-between align-items-center">
        <span>
          <strong>user2</strong> / 1234
        </span>
                    <span class="badge bg-primary">User</span>
                  </li>
                </ul>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
