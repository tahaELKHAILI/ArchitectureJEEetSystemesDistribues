<div class ="container mt-3">
  <div class = "card">
    <div class = "card-header">
      <span><strong>Customer: </strong>{{customer.name}}</span>
      <br>
      <span><strong>Customer ID: </strong>{{customerId}}</span>
    </div>
    <div class="card-body">
      <table class = "table table-hover">
        <thead>
          <tr>
            <th>Account ID</th>
            <th>Account type</th>
            <th>Account balance</th>
          </tr>
        </thead>
          <tbody>
            @for(account of accounts | async; track account.id){
              <tr>
                <td>{{account.id}}</td>
                <td>{{account.type}}</td>
                <td>{{account.balance | number:'1.2-2'}}</td>
              </tr>
            }
          </tbody>
      </table>
    </div>
  </div>
</div>
