<div class ="container mt-3">
  <div class="card">
    <div class ="card-header text-center fw-medium fs-2"><strong>Transactions</strong></div>
    <div class="card-body">
      <form [formGroup]="transactionFromGroup" (ngSubmit)="handleTransaction()">
        <div class = "form-check form-check-inline">
          <input class ="form-check-input" type="radio" value = "CREDIT" formControlName="operationType" name = "operationType">
          <label class="form-check-label">Credit</label>
        </div>

        <div class = "form-check form-check-inline">
          <input class ="form-check-input" type="radio" value = "DEBIT" formControlName="operationType" name = "operationType">
          <label class="form-check-label">Debit</label>
        </div>

        <div class = "form-check form-check-inline">
          <input class ="form-check-input" type="radio" value = "TRANSFER" formControlName="operationType" name = "operationType">
          <label class="form-check-label">Transfer</label>
        </div>

        @if(transactionFromGroup.value["operationType"]=="TRANSFER"){
          <div class = "mt-3">
            <label class = "form-label">Destination Account</label>
            <input type="text" class="form-control" placeholder="Destination" formControlName="destination">
          </div>
        }

        <div class = "mt-3">
          <label class = "form-label">Amount</label>
          <input type="text" class="form-control" placeholder="Amount" formControlName="amount">
        </div>

        <div class = "mt-3">
          <label class = "form-label">Description</label>
          <input type="text" class="form-control" placeholder="Description" formControlName="description">
        </div>

        <div class = "mt-3">
          <button [disabled]="!transactionFromGroup.valid" class ="btn btn-primary">
            <i class = "bi bi-send">Submit</i>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
