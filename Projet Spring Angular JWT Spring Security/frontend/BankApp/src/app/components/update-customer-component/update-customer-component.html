<div class ="container mt-3">
  <div class = "card">
    <div class = "card-header text-center fw-bold fs-2">Update customer</div>
    <div class ="card-body">
      <form [formGroup]="updateCustomerFormGroup" (ngSubmit)="handleUpdateCustomer()" >
        <div class="mb-3">
          <label class="form-label">Id</label>
          <input class="form-control" formControlName="id">
        </div>

        <div class="mb-3">
          <label class="form-label">Name</label>
          <input class="form-control" formControlName="name">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" formControlName="email" type ="email" >
          @if(updateCustomerFormGroup.controls['email'].errors){
            <span class="text-danger">Make sure to insert a valid email address</span>
          }
        </div>
        <button [disabled]="!updateCustomerFormGroup.valid" class="btn btn-success">
          <i class ="bi bi-save2"></i>
          Save
        </button>
      </form>
    </div>
  </div>
</div>
